name: Update GitHub stats

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
    - cron: "35 18 * * *"   # 00:05 IST, right after the day changes
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]
    paths: [scripts/generate-stats.mjs, .github/workflows/update-stats.yml]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVGs
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: update GitHub stats" && git push)
